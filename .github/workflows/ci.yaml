name: ci

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.2"
  SCHEME: "Viku"
  PROJECT: "Viku.xcodeproj"

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with: 
          cache: true

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat
        run: swiftformat --lint .

      - name: Localization audit
        run: scripts/audit_hardcoded_strings.sh --ci


  build:
    name: Build
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project ${{ env.PROJECT }}

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Build
        run: |
          xcodebuild build \
            -project ${{ env.PROJECT }} \
            -scheme ${{ env.SCHEME }} \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO


  test:
    name: Test (${{ matrix.package }})
    runs-on: macos-26
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package:
          - Packages/Features/Calendar
          - Packages/Features/Home
          - Packages/Features/Kanban
          - Packages/Features/Onboarding
          - Packages/Features/Projects
          - Packages/Features/Search
          - Packages/Features/Settings
          - Packages/Features/Tasks
          - Packages/VikuAuth
          - Packages/VikuDesignSystem
          - Packages/VikuNavigation
          - Packages/VikunjaCore
          - Packages/VikunjaNetworking
          - Packages/VikunjaPersistence
          - Packages/VikuUI
          - Packages/VikuWidgetKit
    steps:
      - uses: actions/checkout@v7
      - name: Run tests ${{ matrix.scheme }}
        run: swift test
        working-directory: ${{ matrix.package }}

